
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f2f2f2;
    margin: 10px;
}

h1 {
    font-size: 26px;
}

.table-container {
    overflow-x: auto;
}

.table {
    display: grid;
    grid-template-columns: repeat(18, minmax(55px, 1fr));
    gap: 4px;
    padding: 5px;
    min-width: 1050px;
}

.element {
    border: 1px solid black;
    background: white;
    padding: 4px 2px;
    font-size: 10px;
    min-height: 55px;
    box-sizing: border-box;
}

.element:hover {
    transform: scale(1.08);
    border: 2px solid black;
}

.number {
    font-size: 9px;
    text-align: left;
}

.symbol {
    font-size: 17px;
    font-weight: bold;
}

.name {
    font-size: 9px;
}

.blank {
    visibility: hidden;
}

/* Element group colors */
.alkali { background: #ff9999; }
.alkaline { background: #ffcc99; }
.transition { background: #ffff99; }
.post-transition { background: #ccffcc; }
.metalloid { background: #99ffff; }
.nonmetal { background: #99ccff; }
.halogen { background: #cc99ff; }
.noble { background: #ffccff; }
.lanthanide { background: #ffb3e6; }
.actinide { background: #d9b3ff; }

</style>
</head>

<body>

<h1>Periodic Table of Elements</h1>

<div class="table-container">
<div class="table" id="periodicTable"></div>
</div>

<script>

const table = document.getElementById("periodicTable");

elements.forEach(element => {
    const [number,symbol,name,row,col,type] = element;

    const div = document.createElement("div");
    div.className = "element " + type;

    div.style.gridRow = row;
    div.style.gridColumn = col;

    div.innerHTML = `
        <div class="number">${number}</div>
        <div class="symbol">${symbol}</div>
        <div class="name">${name}</div>
    `;

    div.title = name + " (" + symbol + ")";
    table.appendChild(div);
});

</script>

</body>
</html>
