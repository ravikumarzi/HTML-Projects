<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Task Manager</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      padding: 30px 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 10px 30px #0002;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .task-input {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
    }
l
    button {
      border: none;
      border-radius: 8px;
      padding: 11px 14px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    .add-btn {
      background: #667eea;
      color: white;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .stat {
      background: #f4f5ff;
      padding: 15px 5px;
      text-align: center;
      border-radius: 10px;
    }

    .stat h2 {
      color: #667eea;
      margin-bottom: 5px;
    }

    .stat p {
      color: #666;
      font-size: 12px;
    }

    h3 {
      margin-bottom: 15px;
      color: #333;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 10px;
      border: 1px solid #eee;
      border-radius: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .task-text {
      flex: 1;
      min-width: 100px;
      overflow-wrap: anywhere;
      color: #333;
    }

    .task.done .task-text {
      text-decoration: line-through;
      color: #999;
    }

    .complete-btn {
      background: #e4f8eb;
      color: #168343;
    }

    .task.done .complete-btn {
      background: #eee;
      color: #555;
    }

    .delete-btn {
      background: #ffe7e7;
      color: #d93030;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 20px 0;
    }

    .progress-box {
      margin-bottom: 25px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #555;
      font-size: 13px;
    }

    .progress-track {
      height: 9px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: width 0.3s;
    }

    @media (max-width: 400px) {
      .container {
        padding: 17px;
      }

      .task {
        gap: 7px;
      }

      button {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>📋 My Task Manager</h1>
    <p class="subtitle">Complete your tasks, achieve your goals!</p>

    <form class="task-input" id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter your task..."
        maxlength="200"
        required
      >
      <button type="submit" class="add-btn">+ Add</button>
    </form>

    <div class="stats">
      <div class="stat">
        <h2 id="total">0</h2>
        <p>Total Tasks</p>
      </div>

      <div class="stat">
        <h2 id="completed">0</h2>
        <p>Completed</p>
      </div>

      <div class="stat">
        <h2 id="pending">0</h2>
        <p>Pending</p>
      </div>
    </div>

    <div class="progress-box">
      <div class="progress-info">
        <span>Overall Progress</span>
        <span id="percentage">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <h3>📝 My Tasks</h3>
    <div id="taskList"></div>
  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const taskForm = document.getElementById("taskForm");
    const taskList = document.getElementById("taskList");

    let tasks = [];

    // Load saved tasks from browser
    try {
      tasks = JSON.parse(
        localStorage.getItem("myTasks") || "[]"
      );

      if (!Array.isArray(tasks)) tasks = [];
    } catch {
      tasks = [];
    }

    function saveTasks() {
      localStorage.setItem("myTasks", JSON.stringify(tasks));
    }

    // Add a new task
    taskForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = taskInput.value.trim();

      if (text === "") return;

      tasks.push({
        id: Date.now() + Math.random(),
        text: text,
        completed: false
      });

      saveTasks();
      renderTasks();

      taskInput.value = "";
      taskInput.focus();
    });

    // Mark task complete or incomplete
    function toggleTask(id) {
      tasks = tasks.map(task => {
        if (task.id === id) {
          return {
            ...task,
            completed: !task.completed
          };
        }

        return task;
      });

      saveTasks();
      renderTasks();
    }

    // Delete a task
    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks();
      renderTasks();
    }

    // Display tasks and update statistics
    function renderTasks() {
      taskList.replaceChildren();

      tasks.forEach(task => {
        const item = document.createElement("div");
        item.className = "task" +
          (task.completed ? " done" : "");

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const completeBtn = document.createElement("button");
        completeBtn.className = "complete-btn";
        completeBtn.textContent = task.completed
          ? "✓ Completed"
          : "Mark Complete";

        completeBtn.setAttribute(
          "aria-pressed",
          String(task.completed)
        );

        completeBtn.addEventListener("click", () => {
          toggleTask(task.id);
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "🗑 Delete";

        deleteBtn.addEventListener("click", () => {
          deleteTask(task.id);
        });

        item.append(text, completeBtn, deleteBtn);
        taskList.appendChild(item);
      });

      if (tasks.length === 0) {
        const message = document.createElement("p");
        message.className = "empty";
        message.textContent =
          "No tasks yet. Add your first task! 🎯";

        taskList.appendChild(message);
      }

      const total = tasks.length;
      const completed = tasks.filter(
        task => task.completed
      ).length;

      const pending = total - completed;
      const progress = total === 0
        ? 0
        : Math.round((completed / total) * 100);

      document.getElementById("total").textContent = total;
      document.getElementById("completed").textContent = completed;
      document.getElementById("pending").textContent = pending;
      document.getElementById("percentage").textContent =
        progress + "%";

      document.getElementById("progressBar").style.width =
        progress + "%";
    }

    renderTasks();
  </script>

</body>
</html>
