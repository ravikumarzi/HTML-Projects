<!DOCTYPE html> 
<html>  
<head>  
    <title>SP.AI UI</title>  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- Font Awesome CDN -->  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">  

<style>  
    *{  
        margin:0;  
        padding:0;  
        box-sizing:border-box;  
        font-family: Arial, sans-serif;  
    }  

    body{  
        background:#e5e5e5;  
        display:flex;  
        justify-content:center;  
        align-items:center;  
        height:100vh;  
    }  

    .phone{  
        width:320px;  
        height:640px;  
        background:#0b0f1a;  
        border-radius:40px;  
        padding:20px;  
        position:relative;  
        color:white;  
        box-shadow:0 20px 40px rgba(0,0,0,0.4);  
    }  

    /* Top Bar */  
    .top-bar{  
        display:flex;  
        justify-content:space-between;  
        align-items:center;  
    }  

    .menu, .profile{  
        width:40px;  
        height:40px;  
        border-radius:50%;  
        background:rgba(255,255,255,0.1);  
        display:flex;  
        justify-content:center;  
        align-items:center;  
        cursor:pointer;  
    }  

    /* Content */  
    .content{  
        margin-top:80px;  
        text-align:center;  
    }  

    .content h1{  
        font-size:22px;  
        font-weight:500;  
        color:#ffffffcc;  
    }  

    /* Bottom Bar */  
    .bottom-bar{  
        position:absolute;  
        bottom:20px;  
        left:0;  
        width:100%;  
        padding:0 15px;  
    }  

    .input-box{  
        background:rgba(255,255,255,0.1);  
        backdrop-filter:blur(10px);  
        border-radius:30px;  
        padding:12px 15px;  
        display:flex;  
        align-items:center;  
        gap:10px;  
    }  

    .input-box input{  
        flex:1;  
        background:transparent;  
        border:none;  
        outline:none;  
        color:white;  
        font-size:14px;  
    }  

    .input-box i{  
        cursor:pointer;  
    }  
</style>

</head>  <body>  <div class="phone">  <!-- Top Bar -->  
<div class="top-bar">  
    <div class="menu">  
        <i class="fas fa-bars"></i>  
    </div>  

    <div class="profile">  
        <i class="fas fa-user"></i>  
    </div>  
</div>  

<!-- Main Content -->  
<div class="content">  
    <h1>What can I help with?</h1>  
</div>  

<!-- Bottom Input -->  
<div class="bottom-bar">  
    <div class="input-box">  
        <i class="fas fa-plus"></i>  
        <input type="text" placeholder="Ask SP.AI">  
        <i class="fas fa-microphone"></i>  
        <i class="fas fa-volume-up"></i>  
    </div>  
</div>

</div>  </body>  
</html>
