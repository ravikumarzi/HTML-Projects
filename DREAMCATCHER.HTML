<!DOCTYPE html>
<html>
<head>
<title>DREAMCATCHER App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.app{
    width:360px;
    height:700px;
    background:white;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
    display:flex;
    flex-direction:column;
}

.header{
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    font-size:20px;
}

.header i{
    font-size:20px;
    cursor:pointer;
}

.banner{
    margin:0 20px;
    padding:20px;
    border-radius:20px;
    background: linear-gradient(135deg,#00c6ff,#0072ff);
    color:white;
    font-weight:bold;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.section{
    padding:20px;
}

.section h3{
    margin-bottom:15px;
}

.cards{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:15px;
}

.card{
    background:#f4f6ff;
    padding:15px;
    text-align:center;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.card:hover{
    transform:translateY(-5px);
    background:#e0e7ff;
}

.card i{
    font-size:24px;
    margin-bottom:8px;
    color:#2a5298;
}

.class-grid{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:10px;
}

.class-btn{
    background:#2a5298;
    color:white;
    padding:10px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.class-btn:hover{
    background:#1e3c72;
}

.search{
    padding:15px 20px;
}

.search input{
    width:100%;
    padding:12px;
    border-radius:30px;
    border:none;
    background:#f0f0f0;
}

.bottom-nav{
    margin-top:auto;
    display:flex;
    justify-content:space-around;
    padding:15px 0;
    background:white;
    box-shadow:0 -5px 15px rgba(0,0,0,0.1);
}

.bottom-nav div{
    text-align:center;
    font-size:12px;
    cursor:pointer;
    transition:0.3s;
}

.bottom-nav i{
    font-size:20px;
    display:block;
    margin-bottom:5px;
}

.bottom-nav div:hover{
    color:#2a5298;
}

</style>
</head>

<body>

<div class="app">

    <div class="header">
        <h2>DREAMCATCHER</h2>
        <i class="fa-solid fa-user-circle"></i>
    </div>

    <div class="banner">
        Crack JEE • NEET • UPSC 🚀
    </div>

    <div class="section">
        <h3>Subjects</h3>
        <div class="cards">
            <div class="card">
                <i class="fa-solid fa-atom"></i>
                Physics
            </div>
            <div class="card">
                <i class="fa-solid fa-flask"></i>
                Chemistry
            </div>
            <div class="card">
                <i class="fa-solid fa-square-root-variable"></i>
                Math
            </div>
        </div>
    </div>

    <div class="section">
        <h3>Class Notes</h3>
        <div class="class-grid">
            <div class="class-btn">9th</div>
            <div class="class-btn">10th</div>
            <div class="class-btn">11/12</div>
        </div>
    </div>

    <div class="search">
        <input type="text" placeholder="Search exams, notes, PYQs...">
    </div>

    <div class="bottom-nav">
        <div>
            <i class="fa-solid fa-house"></i>
            Home
        </div>
        <div>
            <i class="fa-solid fa-book"></i>
            PYQ
        </div>
        <div>
            <i class="fa-solid fa-magnifying-glass"></i>
            Search
        </div>
        <div>
            <i class="fa-solid fa-camera"></i>
            Scan
        </div>
    </div>

</div>

</body>
</html>
