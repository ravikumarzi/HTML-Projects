
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
        }

        .calculator {
            width: 320px;
            max-width: 90%;
            background: #2c2c3e;
            padding: 15px;
            border-radius: 10px;
            position: relative;
            box-sizing: border-box;
        }

        /* Three dots menu */
        .menu {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
        }

        .menu div {
            width: 5px;
            height: 5px;
            background: white;
            margin: 3px;
            border-radius: 50%;
        }

        .dropdown {
            display: none;
            position: absolute;
            right: 10px;
            top: 30px;
            background: #444;
            border-radius: 5px;
            z-index: 10;
        }

        .dropdown button {
            display: block;
            width: 100%;
            padding: 8px;
            border: none;
            background: none;
            color: white;
            cursor: pointer;
        }

        .dropdown button:hover {
            background: #666;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 18px;
            text-align: right;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .buttons button {
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background: #ff9500;
            color: white;
            cursor: pointer;
        }

        .buttons button:hover {
            background: #e08600;
        }

        .buttons .equal {
            background: #28a745;
        }

        .hidden {
            display: none;
        }

        .calculator-section button {
            padding: 10px;
            background: #ff9500;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        h3 {
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="calculator">

    <!-- Three Dot Menu -->
    <div class="menu" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
    </div>

    <!-- Dropdown -->
    <div class="dropdown" id="menu">
        <button onclick="showCalc('basic')">Basic Calculator</button>
        <button onclick="showCalc('age')">Age Calculator</button>
        <button onclick="showCalc('income')">Income Calculator</button>
    </div>

    <!-- BASIC CALCULATOR -->
    <div id="basic" class="calculator-section">

        <input type="text" id="display" disabled>

        <div class="buttons">

            <button onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">⌫</button>
            <button onclick="append('%')">%</button>
            <button onclick="append('/')">÷</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button onclick="append('*')">×</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button onclick="append('-')">-</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="append('+')">+</button>

            <button onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>
    </div>

    <!-- AGE CALCULATOR -->
    <div id="age" class="hidden calculator-section">

        <h3>Age Calculator</h3>

        <input type="date" id="dob">

        <button onclick="calculateAge()">Calculate Age</button>

        <h3 id="ageResult"></h3>

    </div>

    <!-- INCOME CALCULATOR -->
    <div id="income" class="hidden calculator-section">

        <h3>Income Calculator</h3>

        <input type="number" id="salary"
               placeholder="Monthly Salary" min="0">

        <input type="number" id="expense"
               placeholder="Monthly Expense" min="0">

        <button onclick="calculateIncome()">Calculate Savings</button>

        <h3 id="incomeResult"></h3>

    </div>

</div>

<script>

    // MENU FUNCTION
    function toggleMenu() {
        let menu = document.getElementById("menu");

        menu.style.display =
            menu.style.display === "block" ? "none" : "block";
    }

    // SHOW CALCULATOR
    function showCalc(type) {

        document.getElementById("basic").classList.add("hidden");
        document.getElementById("age").classList.add("hidden");
        document.getElementById("income").classList.add("hidden");

        document.getElementById(type).classList.remove("hidden");

        document.getElementById("menu").style.display = "none";
    }

    // BASIC CALCULATOR
    function append(val) {
        document.getElementById("display").value += val;
    }

    function calculate() {
        let display = document.getElementById("display");

        try {
            let expression = display.value;

            if (!expression.trim()) {
                return;
            }

            // Allow only calculator characters
            if (!/^[0-9+\-*/%.() ]+$/.test(expression)) {
                throw new Error("Invalid expression");
            }

            let result = Function('"use strict"; return (' + expression + ')')();

            if (!Number.isFinite(result)) {
                throw new Error("Invalid calculation");
            }

            display.value = result;

        } catch (error) {
            display.value = "Error";
        }
    }

    // CLEAR DISPLAY
    function clearDisplay() {
        document.getElementById("display").value = "";
    }

    // DELETE LAST CHARACTER
    function deleteLast() {
        let display = document.getElementById("display");

        display.value = display.value.slice(0, -1);
    }

    // AGE CALCULATOR
    function calculateAge() {

        let dobValue = document.getElementById("dob").value;

        if (!dobValue) {
            document.getElementById("ageResult").innerText =
                "Please select your date of birth.";
            return;
        }

        let dob = new Date(dobValue + "T00:00:00");
        let today = new Date();

        if (dob > today) {
            document.getElementById("ageResult").innerText =
                "Date of birth cannot be in the future.";
            return;
        }

        let years = today.getFullYear() - dob.getFullYear();
        let months = today.getMonth() - dob.getMonth();
        let days = today.getDate() - dob.getDate();

        if (days < 0) {
            months--;

            let lastMonth = new Date(
                today.getFullYear(),
                today.getMonth(),
                0
            );

            days += lastMonth.getDate();
        }

        if (months < 0) {
            years--;
            months += 12;
        }

        document.getElementById("ageResult").innerText =
            `Age: ${years} years, ${months} months, ${days} days`;
    }

    // INCOME CALCULATOR
    function calculateIncome() {

        let salary = document.getElementById("salary").value;
        let expense = document.getElementById("expense").value;

        if (salary === "" || expense === "") {
            document.getElementById("incomeResult").innerText =
                "Please enter salary and expense.";
            return;
        }

        salary = Number(salary);
        expense = Number(expense);

        if (!Number.isFinite(salary) ||
            !Number.isFinite(expense) ||
            salary < 0 || expense < 0) {

            document.getElementById("incomeResult").innerText =
                "Please enter valid amounts.";
            return;
        }

        let saving = salary - expense;

        document.getElementById("incomeResult").innerText =
            "Monthly Savings: ₹" + saving.toFixed(2);
    }

</script>

</body>
</html>
