<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Shooter - 15 Levels</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #ui {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #000000;
            display: flex;
            gap: 20px;
        }
        canvas {
            border: 4px solid #000000;
            background-color: #ffffff;
            cursor: crosshair;
        }
        #gameOverScreen {
            display: none;
            position: absolute;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border: 3px solid #000;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        button:hover {
            background: #333;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>Level: <span id="levelDisplay">1</span>/15</div>
        <div>Score: <span id="scoreDisplay">0</span></div>
        <div>Enemies Left: <span id="enemyDisplay">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="gameOverScreen">
        <h1 id="gameStatusTitle">GAME OVER</h1>
        <p>Your Final Score: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const levelDisplay = document.getElementById('levelDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const enemyDisplay = document.getElementById('enemyDisplay');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const gameStatusTitle = document.getElementById('gameStatusTitle');
        const finalScore = document.getElementById('finalScore');

        // Game State
        let player;
        let bullets = [];
        let enemies = [];
        let score = 0;
        let currentLevel = 1;
        let maxLevels = 15;
        let enemiesToSpawn = 0;
        let enemiesKilledInLevel = 0;
        let spawnInterval;
        let isGameOver = false;

        // Controls
        let keys = {};
        let mouse = { x: 0, y: 0 };

        // Player Class (Black)
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 15;
                this.speed = 4;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#000000'; // Black Character
                ctx.fill();
                ctx.closePath();
            }
            update() {
                if ((keys['w'] || keys['ArrowUp']) && this.y - this.radius > 0) this.y -= this.speed;
                if ((keys['s'] || keys['ArrowDown']) && this.y + this.radius < canvas.height) this.y += this.speed;
                if ((keys['a'] || keys['ArrowLeft']) && this.x - this.radius > 0) this.x -= this.speed;
                if ((keys['d'] || keys['ArrowRight']) && this.x + this.radius < canvas.width) this.x += this.speed;
            }
        }

        // Bullet Class (Black Equipment)
        class Bullet {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.radius = 4;
                this.speed = 7;
                
                let angle = Math.atan2(targetY - y, targetX - x);
                this.dx = Math.cos(angle) * this.speed;
                this.dy = Math.sin(angle) * this.speed;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#000000'; // Black Equipment
                ctx.fill();
                ctx.closePath();
            }
            update() {
                this.x += this.dx;
                this.y += this.dy;
            }
        }

        // Enemy Class (Red)
        class Enemy {
            constructor(x, y, speed) {
                this.x = x;
                this.y = y;
                this.radius = 12;
                this.speed = speed;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#FF0000'; // Red Enemy
                ctx.fill();
                ctx.closePath();
            }
            update(playerX, playerY) {
                let angle = Math.atan2(playerY - this.y, playerX - this.x);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }
        }

        // Initialize/Reset Game
        function init() {
            player = new Player(canvas.width / 2, canvas.height / 2);
            bullets = [];
            enemies = [];
            score = 0;
            currentLevel = 1;
            isGameOver = false;
            gameOverScreen.style.display = 'none';
            startLevel();
        }

        function startLevel() {
            enemies = [];
            bullets = [];
            enemiesKilledInLevel = 0;
            // Level ke hisab se difficulty badhegi
            enemiesToSpawn = 5 + (currentLevel * 3); // Har level me zyada enemies
            
            levelDisplay.innerText = currentLevel;
            scoreDisplay.innerText = score;
            enemyDisplay.innerText = enemiesToSpawn;

            if (spawnInterval) clearInterval(spawnInterval);
            
            // Level badhne par spawn hone ki speed bhi tez hogi
            let spawnRate = Math.max(400, 1500 - (currentLevel * 80)); 
            
            spawnInterval = setInterval(() => {
                if (enemiesToSpawn > 0 && !isGameOver) {
                    spawnEnemy();
                    enemiesToSpawn--;
                } else {
                    clearInterval(spawnInterval);
                }
            }, spawnRate);
        }

        function spawnEnemy() {
            let x, y;
            // Screen ke baahar se kahi se bhi spawn karne ke liye
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -20 : canvas.width + 20;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -20 : canvas.height + 20;
            }
            // Level badhne par enemy ki speed badhegi (Base speed 1 + level * 0.25)
            let enemySpeed = 1 + (currentLevel * 0.25);
            enemies.push(new Enemy(x, y, enemySpeed));
        }

        // Game Loop
        function animate() {
            if (isGameOver) return;

            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Background pure white rahega

            // Update & Draw Player
            player.update();
            player.draw();

            // Bullets handling
            for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
                let bullet = bullets[bIndex];
                bullet.update();
                bullet.draw();

                // Screen se bahar goli jaane par remove karein
                if (bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
                    bullets.splice(bIndex, 1);
                    continue;
                }

                // Bullet and Enemy Collision
                for (let eIndex = enemies.length - 1; eIndex >= 0; eIndex--) {
                    let enemy = enemies[eIndex];
                    let dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);

                    if (dist < bullet.radius + enemy.radius) {
                        // Collision hit!
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                        enemiesKilledInLevel++;
                        scoreDisplay.innerText = score;
                        
                        let totalLevelEnemies = 5 + (currentLevel * 3);
                        enemyDisplay.innerText = totalLevelEnemies - enemiesKilledInLevel;

                        // Level Clear Check
                        if (enemiesKilledInLevel >= totalLevelEnemies) {
                            if (currentLevel < maxLevels) {
                                currentLevel++;
                                startLevel();
                            } else {
                                endGame(true); // Player won 15 levels!
                            }
                        }
                        break;
                    }
                }
            }

            // Enemies handling
            for (let eIndex = enemies.length - 1; eIndex >= 0; eIndex--) {
                let enemy = enemies[eIndex];
                enemy.update(player.x, player.y);
                enemy.draw();

                // Enemy aur Player ka collision (Game Over)
                let dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (dist < player.radius + enemy.radius) {
                    endGame(false);
                }
            }
        }

        function endGame(won) {
            isGameOver = true;
            clearInterval(spawnInterval);
            finalScore.innerText = score;
            if (won) {
                gameStatusTitle.innerText = "VICTORY! YOU BEAT ALL 15 LEVELS!";
                gameStatusTitle.style.color = "green";
            } else {
                gameStatusTitle.innerText = "GAME OVER";
                gameStatusTitle.style.color = "red";
            }
            gameOverScreen.style.display = 'block';
        }

        function resetGame() {
            init();
            animate();
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);
        
        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', () => {
            if (!isGameOver) {
                bullets.push(new Bullet(player.x, player.y, mouse.x, mouse.y));
            }
        });

        // Start the game
        init();
        animate();
    </script>
</body>
</html>
